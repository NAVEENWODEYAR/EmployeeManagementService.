# ==========================================
# Server Configuration
# ==========================================
server:
  port: 8888  # Default port for Spring Cloud Config Server

# ==========================================
# Spring & Git Repository Configuration
# ==========================================
spring:
  application:
    name: CONFIG-SERVER  # Service name registered with Eureka
  cloud:
    config:
      server:
        git:
          uri: https://github.com  # Remote Git repository URL
          clone-on-start: true  # Clone the repository immediately upon startup
          default-label: master  # Default Git branch to fetch configurations from

# ==========================================
# Eureka Service Discovery Configuration
# ==========================================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/  # Eureka server registration endpoint