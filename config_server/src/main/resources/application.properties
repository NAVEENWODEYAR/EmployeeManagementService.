# ==========================================
# 1. Server Configuration
# ==========================================
server:
  port: 8888  # Standard port for Spring Cloud Config Server
  shutdown: graceful  # Allows active requests to finish before stopping the server

# ==========================================
# 2. Spring, Git & Config Server Settings
# ==========================================
spring:
  application:
    name: CONFIG-SERVER  # Service ID registered with Eureka
  profiles:
    active: git  # Explicitly sets the backend mode (git, native, vault, etc.)

  cloud:
    config:
      server:
        # Optional: Default profile if a client doesn't specify one
        default-profile: default
        
        git:
          uri: https://github.com/your-org/your-config-repo  # Remote Git repository URL
          default-label: main  # Default branch name (modern GitHub uses 'main', older repos use 'master')
          clone-on-start: true  # Clones the repo at startup so the first client request isn't slow
          basedir: /tmp/config-repo  # Fixed local folder for the cloned repo (prevents random temp folder buildup)
          
          # --- Git Authentication (Required for Private Repos) ---
          username: ${GIT_USERNAME}  # Set via environment variable (never hardcode credentials)
          password: ${GIT_PASSWORD}  # Use a GitHub Personal Access Token (PAT), not your account password
          
          # --- Git Sync & Reliability Settings ---
          timeout: 5  # Connection timeout in seconds (default: 5)
          refresh-rate: 15  # Minimum seconds between Git fetches (prevents GitHub API rate-limiting)
          force-pull: true  # Discards any accidental local changes in basedir and forces a clean pull
          delete-untracked-branches: true  # Cleans up local branches deleted on remote
          search-paths: '{application}'  # Searches root AND folders named after each microservice
          skip-ssl-validation: false  # Keep false in production; set true only for self-signed corporate Git servers

# ==========================================
# 3. Eureka Service Discovery Configuration
# ==========================================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/  # Eureka Server URL
    register-with-eureka: true  # Registers this server so clients can discover it dynamically
    fetch-registry: true  # Fetches registry info from Eureka
    registry-fetch-interval-seconds: 10  # How often Eureka client updates its local cache (default: 30)
  instance:
    prefer-ip-address: true  # Uses container/host IP instead of hostname (essential for Docker/K8s)
    lease-renewal-interval-in-seconds: 10  # Heartbeat interval sent to Eureka (default: 30)

# ==========================================
# 4. Basic Security (Recommended)
# ==========================================
# Protects your config endpoints (/application/default) from unauthorized access
spring.security:
  user:
    name: ${CONFIG_USER:configadmin}  # Defaults to 'configadmin' if env var isn't set
    password: ${CONFIG_PASS:secret123}  # Change this via environment variable in production

# ==========================================
# 5. Management, Health & Logging
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,env,refresh  # Exposes operational endpoints
  endpoint:
    health:
      show-details: always  # Shows Git repository connection status inside /actuator/health

logging:
  level:
    root: INFO
    org.springframework.cloud.config: DEBUG  # Helpful logs to see which Git files/branches are served to clients